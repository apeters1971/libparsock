name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  alma:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AlmaLinux 9
            image: almalinux:9
          - name: AlmaLinux 10
            image: almalinux:10
    steps:
      - name: Install build tools
        run: dnf -y install git gcc gcc-c++ make cmake openssl openssl-devel
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build --parallel
          ( cd build && ctest --output-on-failure )

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev pkg-config
      - name: Build and test
        run: |
          cmake -S . -B build
          cmake --build build --parallel
          ( cd build && ctest --output-on-failure )

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL 3
        run: brew install openssl@3 cmake
      - name: Build and test
        run: |
          cmake -S . -B build -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --parallel
          ( cd build && ctest --output-on-failure )
